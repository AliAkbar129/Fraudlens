name: Research workbench
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research_lab/requirements.txt
      - run: python -m research_lab.experiment
      - run: python -m pytest -q research_lab/tests
