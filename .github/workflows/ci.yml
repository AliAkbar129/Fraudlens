name: FraudLens CI
on:
  push:
    branches: [main, codex/research-foundations]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt flake8==7.4.1 mypy==1.19.1
      - name: Check Python correctness diagnostics
        run: python -m flake8 . --select=E9,F63,F7,F82 --show-source
      - run: python -m mypy --follow-imports=skip --ignore-missing-imports api models features data explainability
      - run: python -m pytest --cov=. --cov-report=xml -q
  lint-and-test-php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          tools: composer, phpstan:2.1.32
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: phpstan analyse app --level=0 --memory-limit=1G
      - run: vendor/bin/phpunit
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  lint-and-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build
  docker-build:
    needs: [lint-and-test-python, lint-and-test-php, lint-and-test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure local integration stack
        run: |
          cp docker/.env.example .env
          python -c "import base64,secrets;open('.env','a').write('APP_KEY=base64:'+base64.b64encode(secrets.token_bytes(32)).decode()+'\n')"
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Assert actual HTTP responses
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/up
          curl --fail http://127.0.0.1:8088/
          curl --fail http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)" = 503
          test "$(curl -s -H 'Accept: application/json' -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/transactions)" = 401
      - if: always()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
